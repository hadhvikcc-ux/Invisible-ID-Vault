name: Android

# Builds a downloadable debug APK on GitHub Actions.
# The APK is NOT built locally (no Java / Android SDK on dev machines).
# The native android/ platform is NOT committed to the repo (it contains
# binary PNG/JAR assets that cannot be pushed via the GitHub App) — this
# workflow generates it on the runner with `npx cap add android`, then syncs.
on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Generate Android platform and sync web assets
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew -p android assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: invisible-id-vault-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

